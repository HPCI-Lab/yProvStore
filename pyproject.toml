[project]
name = "yProvStore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[all]",
  "dishka",
  "passlib",
  "pyjwt",
  "sqlalchemy",
  "alembic",
  "bcrypt==4.0.1",
  "pycryptodomex>=3.23.0",
  "prov>=2.1.1",
  "lxml>=6.0.0",
  "rdflib>=7.1.4",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest", "flake8"
]
